plugins {
    alias(libs.plugins.shadow)
    id 'checkstyle'
    id 'java-library'
    id 'maven-publish'
}

group = 'com.lixui'

// Artifacts go into build/ unless BUILD_PATH points somewhere else.
def customBuildPath = providers.environmentVariable('BUILD_PATH').orNull ?: layout.buildDirectory.get().asFile
def lwjglVersion = libs.versions.lwjgl.get()
def lwjglModules = ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-stb']
def lwjglApiModules = lwjglModules + ['lwjgl-vulkan']
def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)

repositories {
    mavenCentral()
}

def detectLwjglNatives = {
    String arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    boolean arm = arch.contains('aarch64') || arch.contains('arm64')

    if (osName.contains('win')) {
        return arm ? 'natives-windows-arm64' : 'natives-windows'
    }
    if (osName.contains('mac')) {
        return arm ? 'natives-macos-arm64' : 'natives-macos'
    }
    return arm ? 'natives-linux-arm64' : 'natives-linux'
}

// Natives are needed to run the tests and the demo, never to compile the library.
def lwjglNatives = providers.gradleProperty('lwjglNatives').getOrElse(detectLwjglNatives())

configurations {
    demoNatives {
        canBeConsumed = false
        canBeResolved = true
    }
    testRuntimeOnly {
        extendsFrom demoNatives
    }
}

dependencies {
    api platform(libs.lwjgl.bom)
    api libs.lwjgl
    api libs.lwjgl.glfw
    api libs.lwjgl.opengl
    api libs.lwjgl.vulkan
    api libs.lwjgl.stb
    api libs.slf4j.api

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj
    testRuntimeOnly libs.junit.platform.launcher

    demoNatives platform(libs.lwjgl.bom)
    lwjglModules.each { String module ->
        demoNatives("org.lwjgl:${module}::$lwjglNatives")
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(providers.gradleProperty('java_version').get())
    }

    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all', '-quiet')
}

checkstyle {
    toolVersion = libs.versions.checkstyle.get()
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.withType(Jar).configureEach {
    destinationDirectory.set(file(customBuildPath))

    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
}

// The fat JAR replaces the thin library JAR.
tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    group = 'build'
    description = 'Builds the self-contained JAR with all non-LWJGL dependencies.'
    archiveClassifier.set('')

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()

    // LWJGL belongs to the host application; bundling it would cause duplicate classes.
    dependencies {
        exclude(dependency('org.lwjgl:.*'))
    }

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST',
            'module-info.class', 'META-INF/versions/*/module-info.class'

    manifest {
        attributes(
                'Implementation-Title': rootProject.name,
                'Implementation-Version': project.version.toString(),
                'Implementation-Vendor': 'LixUI'
        )
    }
}

tasks.register('buildReleaseJar') {
    group = 'build'
    description = 'Builds the fat JAR, the sources JAR and the Javadoc JAR.'
    dependsOn 'sourcesJar', 'javadocJar', 'shadowJar'
}

tasks.named('assemble') {
    dependsOn 'buildReleaseJar'
}

[
        demoOpenGl: 'com.lixui.demo.OpenGlDemo',
        demoVulkan: 'com.lixui.demo.VulkanDemo'
].each { String taskName, String entryPoint ->
    tasks.register(taskName, JavaExec) {
        group = 'application'
        description = "Runs ${taskName == 'demoVulkan' ? 'the Vulkan' : 'the OpenGL'} demo."
        classpath = sourceSets.main.runtimeClasspath + configurations.demoNatives
        mainClass = providers.gradleProperty('demoMainClass').orElse(entryPoint)

        // LWJGL loads native libraries and uses Unsafe for direct memory access on Java 25.
        jvmArgs '--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow'

        // GLFW must own the main thread on macOS.
        if (osName.contains('mac')) {
            jvmArgs '-XstartOnFirstThread'
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.named('shadowJar')
            artifact tasks.named('sourcesJar')
            artifact tasks.named('javadocJar')

            pom {
                name = rootProject.name
                description = 'A lightweight retained UI framework for LWJGL.'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                // The fat JAR replaces `components.java`, so API dependencies are declared manually.
                withXml {
                    Node root = asNode()

                    Node managedDependencies = root.appendNode('dependencyManagement').appendNode('dependencies')
                    Node bom = managedDependencies.appendNode('dependency')
                    bom.appendNode('groupId', 'org.lwjgl')
                    bom.appendNode('artifactId', 'lwjgl-bom')
                    bom.appendNode('version', lwjglVersion)
                    bom.appendNode('type', 'pom')
                    bom.appendNode('scope', 'import')

                    Node dependencies = root.appendNode('dependencies')
                    lwjglApiModules.each { String artifactId ->
                        Node dependency = dependencies.appendNode('dependency')
                        dependency.appendNode('groupId', 'org.lwjgl')
                        dependency.appendNode('artifactId', artifactId)
                        dependency.appendNode('scope', 'compile')
                    }
                }
            }
        }
    }

    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
