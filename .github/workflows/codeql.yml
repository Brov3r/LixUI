name: "CodeQL"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'LICENSE'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'LICENSE'
      - '.github/workflows/**'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Java analysis fails while the repository has no sources yet, so the matrix is built at runtime.
  scope:
    name: Detect languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Build language matrix
      id: detect
      shell: bash
      run: |
        set -euo pipefail

        include='[{"language":"actions","build-mode":"none"}'
        if [[ -d src ]] && find src -type f -name '*.java' -print -quit | grep -q .; then
          include+=',{"language":"java-kotlin","build-mode":"manual"}'
        fi
        include+=']'

        echo "matrix={\"include\":${include}}" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up JDK 25
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      if: matrix.language == 'java-kotlin'
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Make Gradle wrapper executable
      if: matrix.language == 'java-kotlin'
      run: chmod +x gradlew

    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Build project
      if: matrix.language == 'java-kotlin' && matrix.build-mode == 'manual'
      # Build cache must be bypassed, otherwise compilation is restored from cache
      # and CodeQL has no compiled classes to analyze.
      run: ./gradlew clean classes --no-build-cache

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: "/language:${{ matrix.language }}"
